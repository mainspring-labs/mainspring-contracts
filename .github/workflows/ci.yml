name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 28.1.0

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install stellar-cli
        run: |
          curl -sSL -o stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf stellar.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Build example Wasm (tests import it)
        run: |
          stellar contract build --package tipjar-v1
          stellar contract build --package tipjar-v2

      - name: Build contract Wasm
        run: |
          stellar contract build --package mainspring-spring
          stellar contract build --package mainspring-factory

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace
